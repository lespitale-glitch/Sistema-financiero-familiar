# Finanzas Familiares - despliegue local con Docker Compose.
# Requiere un archivo .env junto a este compose (ver .env.example).
services:
  app:
    build: .
    container_name: finanzas-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file: .env
    environment:
      NODE_ENV: production
      SQLITE_PATH: /app/data/finanzas.sqlite
      PORT: ${PORT:-3000}
    volumes:
      - finanzas-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  finanzas-data:
